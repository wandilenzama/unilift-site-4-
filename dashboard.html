<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="unilift-logo.png" type="image/png">
  <title>UniLift – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #14285a;
      --navy-deep: #0d1c40;
      --gold: #f0a81e;
      --gold-dark: #d38f0b;
      --gold-soft: #fff3d6;
      --mist: #f3f5fa;
      --line: #d9deeb;
      --ink: #1d2740;
      --muted: #55607a;
      --error: #b3261e;
      --ok: #1b7a43;
      --ok-soft: #e3f4ea;
      --warn-soft: #fff3d6;
      --info-soft: #e4ebfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--mist);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
    }

    h1, h2, h3 { font-family: "Sora", sans-serif; color: var(--navy); line-height: 1.15; }
    h1 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; }
    h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.75rem; }
    h3 { font-size: 1.05rem; font-weight: 700; }

    button, input, select { font: inherit; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    .wrap { width: min(1080px, 100% - 2rem); margin-inline: auto; }
    [hidden] { display: none !important; }

    /* ---------- Top bar ---------- */
    .topbar { background: var(--navy-deep); color: #fff; position: sticky; top: 0; z-index: 20; }
    .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.8rem 0; }
    .brand { font-family: "Sora", sans-serif; font-weight: 800; font-size: 1.4rem; color: #fff; text-decoration: none; letter-spacing: -0.02em; }
    .brand span { color: var(--gold); }
    .top-right { display: flex; align-items: center; gap: 0.9rem; }
    .who { text-align: right; line-height: 1.2; font-size: 0.9rem; }
    .who strong { display: block; }
    .who span { color: #b9c4e6; font-size: 0.8rem; }

    .top-btn {
      background: transparent; color: #fff; border: 1.5px solid #3a4c85; border-radius: 999px;
      padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.875rem; position: relative;
    }
    .top-btn:hover { border-color: var(--gold); }
    .badge {
      background: var(--gold); color: var(--navy-deep); font-weight: 700; font-size: 0.72rem;
      border-radius: 999px; padding: 0.05rem 0.45rem; margin-left: 0.35rem;
    }

    /* ---------- Notification panel ---------- */
    .notif-panel {
      position: absolute; right: 1rem; top: 3.6rem; width: min(360px, calc(100% - 2rem));
      background: #fff; color: var(--ink); border-radius: 14px; z-index: 30;
      box-shadow: 0 12px 34px rgba(13, 28, 64, 0.25); max-height: 70vh; overflow: auto;
    }
    .notif-panel header { padding: 0.9rem 1rem; border-bottom: 1px solid var(--line); font-weight: 700; color: var(--navy); }
    .notif { padding: 0.75rem 1rem; border-bottom: 1px solid var(--mist); font-size: 0.9rem; }
    .notif.unread { background: var(--gold-soft); }
    .notif time { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    .notif-empty { padding: 1.25rem 1rem; color: var(--muted); font-size: 0.9rem; }

    /* ---------- Layout ---------- */
    main { padding: 1.75rem 0 4rem; }
    .narrow { max-width: 640px; margin-inline: auto; }
    .sub { color: var(--muted); margin: 0.4rem 0 1.25rem; }
    .greeting { margin-bottom: 1.25rem; }

    .tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.25rem; margin-bottom: 1.5rem; }
    .tab {
      border: 0; background: #fff; color: var(--muted); font-weight: 500; white-space: nowrap;
      padding: 0.6rem 1.1rem; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--line);
    }
    .tab[aria-current="page"] { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 700; }

    .card { background: #fff; border-radius: 16px; padding: 1.25rem 1.4rem; box-shadow: 0 2px 10px rgba(20, 40, 90, 0.07); margin-bottom: 1.1rem; }
    .section-title { margin: 1.75rem 0 0.75rem; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; margin-bottom: 1.5rem; }
    .stat { background: #fff; border-radius: 14px; padding: 1rem 1.1rem; border-top: 4px solid var(--gold); }
    .stat b { display: block; font-family: "Sora", sans-serif; font-size: 1.6rem; color: var(--navy); }
    .stat span { color: var(--muted); font-size: 0.85rem; }

    .vehicle-strip { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: center; justify-content: space-between; }
    .plate {
      display: inline-block; font-family: "Sora", sans-serif; font-weight: 700; letter-spacing: 0.08em;
      background: var(--gold); color: var(--navy-deep); border-radius: 6px; padding: 0.15rem 0.6rem;
    }

    /* ---------- Forms ---------- */
    .field { margin-bottom: 0.95rem; }
    .lbl { display: block; font-size: 0.85rem; font-weight: 700; color: var(--navy); margin-bottom: 0.3rem; }
    input[type="text"], input[type="tel"], input[type="number"], input[type="date"], input[type="time"], input[type="password"], select, input[type="file"], textarea {
      width: 100%; font-size: 0.95rem; color: var(--ink); background: #fafbfd; font-family: inherit;
      border: 1.5px solid var(--line); border-radius: 12px; padding: 0.7rem 0.85rem;
    }
    textarea { resize: vertical; min-height: 4rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(20, 40, 90, 0.15); background: #fff; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
    .hint { font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; }
    .check { display: flex; gap: 0.5rem; align-items: flex-start; font-size: 0.9rem; color: var(--muted); margin: 0.4rem 0 1rem; }
    .check input { margin-top: 0.25rem; accent-color: var(--navy); }
    .msg { font-size: 0.875rem; min-height: 1.2rem; margin-bottom: 0.6rem; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }

    .btn {
      display: inline-block; border: 0; background: var(--navy-deep); color: #fff; font-family: "Sora", sans-serif;
      font-weight: 700; font-size: 0.95rem; padding: 0.85rem 1.6rem; border-radius: 12px; cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: var(--navy); }
    .btn.gold { background: var(--gold); color: var(--navy-deep); }
    .btn.gold:hover { background: var(--gold-dark); }
    .btn.block { width: 100%; }
    .btn-sm {
      border: 1.5px solid var(--navy); background: #fff; color: var(--navy); font-weight: 700; font-size: 0.82rem;
      padding: 0.4rem 0.85rem; border-radius: 999px; cursor: pointer;
    }
    .btn-sm:hover { background: var(--navy); color: #fff; }
    .btn-sm.danger { border-color: var(--error); color: var(--error); }
    .btn-sm.danger:hover { background: var(--error); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---------- Ride cards ---------- */
    .ride-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1rem; align-items: flex-start; }
    .ride-head h3 .arrow { color: var(--gold-dark); margin: 0 0.3rem; }
    .meta { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
    .price { font-family: "Sora", sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--navy); text-align: right; }
    .price small { display: block; font-family: "DM Sans", sans-serif; font-weight: 400; font-size: 0.78rem; color: var(--muted); }

    .pill { display: inline-block; font-size: 0.75rem; font-weight: 700; border-radius: 999px; padding: 0.15rem 0.6rem; }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .pill.warn { background: var(--warn-soft); color: #8a5a00; }
    .pill.info { background: var(--info-soft); color: var(--navy); }
    .pill.grey { background: var(--mist); color: var(--muted); }

    .pax-list { margin-top: 1rem; border-top: 1px solid var(--mist); }
    .pax { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1rem; padding: 0.8rem 0; border-bottom: 1px solid var(--mist); }
    .pax:last-child { border-bottom: 0; }
    .pax small { color: var(--muted); display: block; }
    .pax-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }

    .return-box { background: var(--gold-soft); border-left: 4px solid var(--gold); border-radius: 8px; padding: 0.8rem 1rem; margin-top: 0.9rem; }
    .return-box p { font-size: 0.9rem; margin-bottom: 0.5rem; }
    .return-form { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; }
    .return-form .field { margin: 0; }
    .return-form input { width: auto; }

    .empty { background: #fff; border: 2px dashed var(--line); border-radius: 16px; padding: 1.75rem 1.25rem; text-align: center; color: var(--muted); margin-bottom: 1rem; }
    .empty .btn-sm { margin-top: 0.75rem; }

    .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }

    .method-opt { display: flex; gap: 0.7rem; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 0.75rem 0.9rem; margin-bottom: 0.6rem; cursor: pointer; }
    .method-opt input { margin-top: 0.3rem; accent-color: var(--navy); }
    .method-opt.disabled { opacity: 0.55; cursor: not-allowed; }
    .method-opt:has(input:checked) { border-color: var(--gold); background: var(--gold-soft); }
    .method-opt strong { display: block; color: var(--navy); }
    .method-opt span { font-size: 0.85rem; color: var(--muted); }

    .tt-grid { display: grid; grid-template-columns: 4rem 1fr 1fr; gap: 0.5rem 0.8rem; align-items: center; margin-bottom: 1rem; }
    .tt-grid .head { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
    .tt-grid .day { font-weight: 700; color: var(--navy); }

    .credit {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%); color: #fff; border-radius: 16px;
      padding: 1.1rem 1.3rem; margin-bottom: 1rem; max-width: 360px;
    }
    .credit .num { font-family: "Sora", sans-serif; font-size: 1.2rem; letter-spacing: 0.12em; margin: 0.7rem 0; }
    .credit .row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #c9d2ec; }

    dl.bank { display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 1rem; margin: 1rem 0; }
    dl.bank dt { color: var(--muted); font-size: 0.875rem; }
    dl.bank dd { font-weight: 700; color: var(--navy); word-break: break-all; }

    /* ---------- Dialog & toast ---------- */
    dialog { border: 0; border-radius: 18px; padding: 0; width: min(480px, calc(100% - 2rem)); max-height: 90vh; }
    dialog::backdrop { background: rgba(13, 28, 64, 0.55); }
    .modal-body { padding: 1.4rem 1.5rem 1.5rem; }
    .modal-close { float: right; background: none; border: 0; font-size: 1.5rem; line-height: 1; color: var(--muted); cursor: pointer; }
    .toast {
      position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); background: var(--navy-deep); color: #fff;
      padding: 0.75rem 1.25rem; border-radius: 999px; font-size: 0.9rem; z-index: 60; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 820px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .filters, .row3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .row2 { grid-template-columns: 1fr; }
      .who { display: none; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html">Uni<span>Lift</span></a>
      <div class="top-right">
        <div class="who"><strong id="who-name"></strong><span id="who-role"></span></div>
        <button class="top-btn" id="bell" data-action="bell" aria-haspopup="true" aria-expanded="false">Notifications<span class="badge" id="bell-count" hidden>0</span></button>
        <button class="top-btn" data-action="logout">Log out</button>
      </div>
    </div>
  </header>

  <div class="notif-panel" id="notif-panel" hidden></div>

  <main class="wrap" id="app"></main>

  <dialog id="modal">
    <div class="modal-body">
      <button class="modal-close" data-action="close-modal" aria-label="Close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <datalist id="places">
    <option value="Steve Biko Campus"></option>
    <option value="ML Sultan Campus"></option>
    <option value="Ritson Campus"></option>
    <option value="Brickfield Campus"></option>
    <option value="City Campus"></option>
    <option value="Riverside Campus"></option>
    <option value="Indumiso Campus (Pietermaritzburg)"></option>
    <option value="Berea"></option>
    <option value="Overport"></option>
    <option value="Glenwood"></option>
    <option value="Umlazi"></option>
    <option value="Chatsworth"></option>
    <option value="Pinetown"></option>
    <option value="Phoenix"></option>
    <option value="Umhlanga"></option>
    <option value="Isipingo"></option>
    <option value="Amanzimtoti"></option>
    <option value="Kwamashu"></option>
  </datalist>

<script src="js/dashboard.js" defer></script>
</body>
</html>
